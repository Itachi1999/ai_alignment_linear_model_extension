experiment:
  name: exp015_lambda_varying_violations
  summary: Synthetic experiment with Gaussian candidate data and Normalized Mallows
    model preference generator. Here, we check the PO and PMC violations of the old
    epsilon LP and the new KT min LP model and the BTL linear model and also the weighted
    KT min LP model and the Borda KT min LP model.
  num_trials: 20
  seed: 42
  data:
    num_voters: 3
    num_alternatives: 25
    dimension: 10
    mean: 0.0
    std: 1.0
    dispersion: 0.5
  optimization:
    eta: 1.0e-05
    lambda_: 10
    solver: HIGHS
    max_iterations: 100
    tolerance: 1.0e-06
  lambda_:
    grid:
    - 0.0
    - 20.0
    - 40.0
    - 60.0
    - 80.0
    - 100.0
    - 120.0
    - 140.0
    - 160.0
    - 180.0
    - 200.0
  logging:
    save_summary: true
    save_trials: true
    save_figures: true
    save_tables: true
