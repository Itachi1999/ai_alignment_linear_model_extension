[project]
name = "ai-alignment-linear-model-extension"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soumya Nasipuri", email = "nasipurisoumya@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.9.2",
    "hydra-core>=1.3.4",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tqdm>=4.70.0",
]

[project.scripts]
ai-alignment-linear-model-extension = "ai_alignment_linear_model_extension:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
